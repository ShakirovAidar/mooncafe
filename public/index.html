function detectLang(){try{const l=localStorage.getItem("lang");if(l==="ru"||l==="en"||l==="th")return l}catch{}const nav=(navigator.language||"").toLowerCase();if(nav.startsWith("th"))return "th";if(/^(ru|uk|be|kk|uz|ky|tg|hy|az|ka)/.test(nav))return "ru";return "en"}
let LANG=detectLang();

const nm=i=>{if(LANG==="en")return (EN.i[i.id]||[i.n])[0];if(LANG==="th")return (TH.i[i.id]||[i.n])[0];return i.n};
const lb=v=>{if(LANG==="en")return (EN.i[v.id]||[v.l,v.l])[1];if(LANG==="th")return (TH.i[v.id]||[v.l,v.l])[1];return v.l};
const ds=i=>{const src=LANG==="en"?EN.i:LANG==="th"?TH.i:null;const d=src&&src[i.id]?src[i.id][1]:i.d;return d||(i.v?i.v.map(lb).join(", "):"")};
const cname=c=>{if(LANG==="en")return EN.c[c.id]||c.name;if(LANG==="th")return TH.c[c.id]||c.name;return c.name};
const gn=c=>{if(LANG==="en")return EN.g[c.group]||c.group;if(LANG==="th")return TH.g[c.group]||c.group;return c.group};

 const tb=document.getElementById("tabs"),dk=document.getElementById("list"),a=tb?tb.scrollLeft:0,b=dk?dk.scrollLeft:0;

const $=document.getElementById("app");
const money=n=>n.toLocaleString("en-US")+" ฿";
const qty=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const sum=()=>Object.entries(S.cart).reduce((a,[id,q])=>a+ALL[id].p*q,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ctl(id){const q=S.cart[id]||0;
 return q?`<div class="step"><button data-a="dec" data-id="${id}" aria-label="${t("remove")}">−</button><span>${q}</span><button data-a="inc" data-id="${id}" aria-label="${t("add")}">+</button></div>`

const priceTxt=i=>{if(!i.v)return money(i.p);const ps=i.v.map(v=>v.p),lo=Math.min(...ps);return (lo===Math.max(...ps)?"":t("from")+" ")+money(lo)};
const cnt=i=>i.v.reduce((a,v)=>a+(S.cart[v.id]||0),0);

 const s=esc(i.img),a=esc(nm(i)),ld=k?"lazy":"eager";

 }).join("");

function sheetHTML(){
 if(!S.sheet) return "";
 let h="";
 if(S.sheet==="cart"){
  const rows=Object.entries(S.cart).map(([id,q])=>{
   const item=ALL[id]; if(!item) return "";
   return `<div class="line"><div class="n">${esc(nm(item))}<small>${money(item.p)} × ${q}</small></div><div class="step"><button data-a="dec" data-id="${id}">−</button><span>${q}</span><button data-a="inc" data-id="${id}">+</button></div><div class="s">${money(item.p*q)}</div></div>`;
  }).join("");
  h=`<h2>${t("cart")}<button class="x" data-a="close" aria-label="${t("close")}">×</button></h2><div class="body">${rows||`<div class="empty">${t("empty")}</div>`}</div>
  ${rows?`<div class="total"><span>${t("total")}</span><b>${money(sum())}</b></div>`:""}`;
 }else if(S.sheet==="opts"){
  const p=CATS.flatMap(c=>c.items).find(x=>x.id===S.prod);
  if(!p||!p.v) return "";
  h=`<h2>${esc(nm(p))}<button class="x" data-a="close" aria-label="${t("close")}">×</button></h2><div class="body">${p.v.map(v=>`<div class="line"><div class="n">${esc(lb(v))}</div><div class="s">${money(v.p)}</div><div class="ctl" id="ctl-${v.id}">${ctl(v.id)}</div></div>`).join("")}</div><div class="two" style="grid-template-columns:1fr"><button class="btn" data-a="close">${t("done")}</button></div>`;
 }
 return `<div class="sheet open"><div class="back" data-a="close"></div><div class="panel" role="dialog">${h}</div></div>`;
}

  if(!el)return;
  // Показывать только 1 раз за сессию
  if(S.beerShown){ el.hidden=true; return; }
  const mainIds = new Set();
  for(const c of CATS){
    if(["burgers","main","grill","hotpot","salads"].includes(c.id)){
      for(const i of c.items){
        if(i.v) i.v.forEach(v=>mainIds.add(v.id));
        else mainIds.add(i.id);
      }
    }
  }
  const hasMain = Object.keys(S.cart).some(id=>mainIds.has(id) && S.cart[id]>0);
  const hasBeer = Object.keys(S.cart).some(id=>id.startsWith("br") && S.cart[id]>0);
  const show = hasMain && !hasBeer;
  el.hidden = !show;
  if(show) S.beerShown = true; // больше не показывать в этой сессии
}

function render(){
 if(S.screen==="welcome"){$.innerHTML=`<div class="welcome"><img class="logo" src="${LOGO}" alt="Afterwave Moonshine Bar"><p>${t("tagline")}</p><button class="btn" data-a="open">${t("view")}</button></div>`;return;}
 if(S.screen==="thanks"){$.innerHTML=`<div class="thanks"><img src="${LOGO}" alt=""><h1>${t("thanks")}</h1><p>${t("thanksText")}</p><button class="btn ghost" data-a="home">${t("home")}</button></div>`;return;}
 const cur=CATS.find(x=>x.id===S.cat);
 $.innerHTML=`<div class="screen-main">
 <div class="top"><img src="${LOGO}" alt=""><div><b>Afterwave</b><small>Moonshine bar</small></div></div>
 <div class="tabs" id="tabs">${CATS.map(c=>`<button class="tab ${c.id===S.cat?"on":""}" data-a="cat" data-id="${c.id}">${cname(c)}</button>`).join("")}</div>
 <div class="head2"><span class="grp">${gn(cur)}</span><span class="cnt" id="cnt">${cur.items.length} поз.</span></div>
 <div class="deck" id="list">${items()}</div>
 <div class="beer-upsell" id="beerUpsell" hidden>
  <button type="button" class="beer-no" data-a="beer-dismiss">${t("beerNo")}</button>
  <button type="button" class="beer-yes" data-a="beer-upsell">${t("beerYes")}</button>
 </div>
 <div class="cartbar" id="cartbar" hidden></div>
</div><div id="sheet">${sheetHTML()}</div>`;
 bar();
 const l=document.getElementById("list"),cn=document.getElementById("cnt");
 // scroll to current category page
 const idx0=CATS.findIndex(x=>x.id===S.cat);
 if(l){l.scrollLeft=idx0*l.clientWidth;}
 if(cn){const c=CATS.find(x=>x.id===S.cat);cn.textContent=(c?c.items.length:0)+" поз.";}
 // horizontal snap → change category
 let scrollTO=null, advancing=false;
 l.addEventListener("scroll",()=>{
  clearTimeout(scrollTO);
  scrollTO=setTimeout(()=>{
   if(!l.clientWidth) return;
   const idx=Math.round(l.scrollLeft/l.clientWidth);
   const cat=CATS[Math.max(0,Math.min(CATS.length-1,idx))];
   if(cat && cat.id!==S.cat){
    advancing=true;
    setCat(cat.id, true);
    setTimeout(()=>advancing=false,200);
   }
  },60);
 },{passive:true});
}

function refresh(id){
 const c=document.getElementById("ctl-"+id);if(c)c.innerHTML=ctl(id);
 const pp=PROD[id];if(pp){const pc=document.getElementById("ctl-"+pp.id);if(pc)pc.innerHTML=pick(pp);}
 bar();
 if(S.sheet==="cart"){if(!qty()){S.sheet=null;}document.getElementById("sheet").innerHTML=sheetHTML();}
}

function setCat(id, fromScroll){
 S.cat=id;const c=CATS.find(x=>x.id===id);
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 const grp=document.querySelector(".head2 .grp");if(grp)grp.textContent=gn(c);
 const cn=document.getElementById("cnt");if(cn)cn.textContent=c.items.length+" поз.";
 const l=document.getElementById("list");
 if(l && !fromScroll){
  const idx=CATS.findIndex(x=>x.id===id);
  l.scrollTo({left:idx*l.clientWidth,behavior:"smooth"});
  // scroll active page to top
  const page=l.querySelector(`.cat-page[data-cat="${id}"]`);
  if(page) page.scrollTop=0;
 }
 const b=document.querySelector(".tab.on"),t=document.getElementById("tabs");
 if(b&&t) t.scrollTo({left:t.scrollLeft+b.getBoundingClientRect().left-t.getBoundingClientRect().left-(t.clientWidth-b.offsetWidth)/2,behavior:"smooth"});
 updateUpsell();
}
$.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==="open"){S.screen="menu";render();}
 else if(a==="home"){S.screen="welcome";render();}
 else if(a==="cat"){setCat(id);}
 else if(a==="inc"){S.cart[id]=(S.cart[id]||0)+1;refresh(id);}
 else if(a==="dec"){S.cart[id]=(S.cart[id]||0)-1;if(S.cart[id]<=0)delete S.cart[id];refresh(id);}
 else if(a==="opts"){S.sheet="opts";S.prod=id;document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="beer-dismiss"){S.beerShown=true;const el=document.getElementById("beerUpsell");if(el)el.hidden=true;}
 else if(a==="beer-upsell"){S.beerShown=true;const el=document.getElementById("beerUpsell");if(el)el.hidden=true;S.cat="beerwine";setCat("beerwine");S.sheet="opts";S.prod="br";document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="cart"){S.sheet="cart";document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="close"){S.sheet=null;document.getElementById("sheet").innerHTML="";}
});
render();
</script>
</body>
</html>
