function detectLang(){try{const l=localStorage.getItem("lang");if(l==="ru"||l==="en")return l}catch{}return /^(ru|uk|be|kk|uz|ky|tg|hy|az|ka)/i.test(navigator.language||"")?"ru":"en"}
let LANG=detectLang();
const t=k=>T[LANG][k];
const nm=i=>LANG==="en"?EN.i[i.id][0]:i.n, ds=i=>LANG==="en"?EN.i[i.id][1]:i.d, cname=c=>LANG==="en"?EN.c[c.id]:c.name, gn=c=>LANG==="en"?EN.g[c.group]:c.group;
function paintMeta(){document.documentElement.lang=LANG;document.title=t("title");const d=document.querySelector('meta[name="description"]');if(d)d.content=t("desc")}
function paintLang(){const el=document.getElementById("lang");if(!el)return;el.dataset.l=LANG;el.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG))}
function setLang(l){if(l===LANG)return;LANG=l;try{localStorage.setItem("lang",l)}catch{}paintMeta();paintLang();
 const tb=document.getElementById("tabs"),dk=document.getElementById("list"),a=tb?tb.scrollLeft:0,b=dk?dk.scrollLeft:0;
 render();const tb2=document.getElementById("tabs"),dk2=document.getElementById("list");if(tb2)tb2.scrollLeft=a;if(dk2)dk2.scrollLeft=b}
paintMeta();paintLang();
const S={screen:"welcome",cat:CATS[0].id,cart:{},sheet:null,mode:null,phone:"",map:"",when:"asap",time:"",touched:false,sending:false,fail:false};
const $=document.getElementById("app");
const money=n=>n.toLocaleString("en-US")+" ฿";
const qty=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const sum=()=>Object.entries(S.cart).reduce((a,[id,q])=>a+ALL[id].p*q,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ctl(id){const q=S.cart[id]||0;
 return q?`<div class="step"><button data-a="dec" data-id="${id}" aria-label="${t("remove")}">−</button><span>${q}</span><button data-a="inc" data-id="${id}" aria-label="${t("add")}">+</button></div>`
 :`<button class="add" data-a="inc" data-id="${id}" aria-label="${t("toCart")}">+</button>`;}
function bar(){const b=document.getElementById("cartbar");if(!b)return;
 b.hidden=!qty();b.innerHTML=`<button class="btn" data-a="cart"><span>${t("cart")} · ${qty()}</span><span>${money(sum())}</span></button>`;}
function items(){const c=CATS.find(x=>x.id===S.cat);
 return c.items.map((i,k)=>`<article class="card" style="animation-delay:${k*.08}s"><div class="pic">${i.img?`<img src="${esc(i.img)}" alt="${esc(nm(i))}" onerror="this.remove()">`:""}<span class="big">${i.i}</span></div><div class="meta"><div class="t"><h3>${esc(nm(i))}</h3><p>${esc(ds(i))}</p><div class="pr">${money(i.p)}</div></div><div class="ctl" id="ctl-${i.id}">${ctl(i.id)}</div></div></article>`).join("");}

function sheetHTML(){
 if(!S.sheet)return "";
 let h="";
 if(S.sheet==="cart"){
  const rows=Object.entries(S.cart).map(([id,q])=>`<div class="line"><div class="n">${esc(nm(ALL[id]))}<small>${money(ALL[id].p)} × ${q}</small></div><div class="step"><button data-a="dec" data-id="${id}">−</button><span>${q}</span><button data-a="inc" data-id="${id}">+</button></div><div class="s">${money(ALL[id].p*q)}</div></div>`).join("");
  h=`<h2>${t("cart")}<button class="x" data-a="close" aria-label="${t("close")}">×</button></h2><div class="body">${rows||`<div class="empty">${t("empty")}</div>`}</div>
  ${rows?`<div class="total"><span>${t("total")}</span><b>${money(sum())}</b></div><div class="two"><button class="btn" data-a="mode" data-m="delivery">${t("delivery")}</button><button class="btn ghost" data-a="mode" data-m="pickup">${t("pickup")}</button></div>`:""}`;
 }else{
  const d=S.mode==="delivery",ok=valid();
  h=`<h2>${d?t("delivery"):t("pickup")}<button class="x" data-a="close" aria-label="${t("close")}">×</button></h2><div class="body">
  ${d?`<label for="ph">${t("phone")}</label><div class="field"><input id="ph" type="tel" inputmode="tel" placeholder="+66 81 234 5678" value="${esc(S.phone)}" autocomplete="tel"></div><div class="err" id="e-ph"></div>
  <label for="mp">${t("map")}</label><div class="field"><input id="mp" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/..." value="${esc(S.map)}" autocapitalize="none" autocorrect="off"></div><div class="err" id="e-mp"></div>
  <div class="note">📍 ${t("ny")}</div>`
  :`<label>${t("when")}</label><div class="when"><button class="opt ${S.when==="asap"?"on":""}" data-a="when" data-w="asap">${t("asap")}</button><button class="opt ${S.when==="time"?"on":""}" data-a="when" data-w="time">${t("later")}</button></div>
  ${S.when==="time"?`<div class="field" style="margin-top:10px"><input id="tm" type="time" value="${esc(S.time)}"></div><div class="err" id="e-tm"></div>`:""}`}
  <div class="total"><span>${t("total")}</span><b>${money(sum())}</b></div></div>
  ${S.fail?`<div class="err">${t("fail")}</div>`:""}
  <div class="two"><button class="btn ghost" data-a="tocart">${t("back")}</button><button class="btn" id="go" data-a="send" ${ok&&!S.sending?"":"disabled"}>${S.sending?t("sending"):t("order")}</button></div>`;
 }
 return `<div class="sheet open"><div class="back" data-a="close"></div><div class="panel" role="dialog">${h}</div></div>`;
}
const MAP_RE=/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)/i;
const phOk=()=>{const n=S.phone.replace(/\D/g,"").length;return n>=8&&n<=15};
const mapOk=()=>MAP_RE.test(S.map.trim());
const timeOk=()=>S.when==="asap"||/^\d{2}:\d{2}$/.test(S.time);
function valid(){return S.mode==="delivery"?phOk()&&mapOk():timeOk();}
function errs(){const s=(id,m)=>{const e=document.getElementById(id);if(e)e.textContent=S.touched&&m?m:""};
 s("e-ph",!phOk()&&t("errPhone"));s("e-mp",!mapOk()&&t("errMap"));s("e-tm",!timeOk()&&t("errTime"));
 const g=document.getElementById("go");if(g)g.disabled=!valid()||S.sending;}

function render(){
 if(S.screen==="welcome"){$.innerHTML=`<div class="welcome"><img class="logo" src="${LOGO}" alt="Afterwave Moonshine Bar"><p>${t("tagline")}</p><button class="btn" data-a="open">${t("view")}</button></div>`;return;}
 if(S.screen==="thanks"){$.innerHTML=`<div class="thanks"><img src="${LOGO}" alt=""><h1>${t("thanks")}</h1><p>${t("thanksText")}</p><button class="btn ghost" data-a="home">${t("home")}</button></div>`;return;}
 const cur=CATS.find(x=>x.id===S.cat);
 $.innerHTML=`<div class="top"><img src="${LOGO}" alt=""><div><b>Afterwave</b><small>Moonshine bar</small></div></div>
 <div class="tabs" id="tabs">${CATS.map(c=>`<button class="tab ${c.id===S.cat?"on":""}" data-a="cat" data-id="${c.id}">${cname(c)}</button>`).join("")}</div>
 <div class="head2"><span class="grp">${gn(cur)}</span><span class="cnt" id="cnt">1 / ${cur.items.length}</span></div><div class="deck" id="list">${items()}</div><div class="cartbar" id="cartbar" hidden></div><div id="sheet">${sheetHTML()}</div>`;
 bar();const l=document.getElementById("list"),cn=document.getElementById("cnt");const cw=()=>{const c=l.querySelector(".card");return c?c.offsetWidth+14:1};l.addEventListener("scroll",()=>{const k=CATS.find(x=>x.id===S.cat).items.length;cn.textContent=Math.min(k,Math.round(l.scrollLeft/cw())+1)+" / "+k},{passive:true});
}
function refresh(id){
 const c=document.getElementById("ctl-"+id);if(c)c.innerHTML=ctl(id);bar();
 if(S.sheet==="cart"){if(!qty()){S.sheet=null;}document.getElementById("sheet").innerHTML=sheetHTML();}
}
async function send(){
 S.touched=true;if(!valid()){errs();return;}
 S.sending=true;S.fail=false;document.getElementById("sheet").innerHTML=sheetHTML();
 const order={mode:S.mode,phone:S.mode==="delivery"?S.phone.trim():null,map:S.mode==="delivery"?S.map.trim():null,when:S.mode==="pickup"?(S.when==="asap"?"ASAP":S.time):null,
  items:Object.entries(S.cart).map(([id,q])=>({id,qty:q}))};
 try{
  if(ORDER_ENDPOINT){const r=await fetch(ORDER_ENDPOINT,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(order),signal:AbortSignal.timeout(10000)});if(!r.ok)throw 0;}
  S.sending=false;S.sheet=null;S.cart={};S.screen="thanks";render();
 }catch{S.sending=false;S.fail=true;document.getElementById("sheet").innerHTML=sheetHTML();}
}
function setCat(id){S.cat=id;const c=CATS.find(x=>x.id===id);
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 document.querySelector(".head2 .grp").textContent=gn(c);
 document.getElementById("cnt").textContent="1 / "+c.items.length;
 const l=document.getElementById("list");l.innerHTML=items();l.scrollLeft=0;
 const b=document.querySelector(".tab.on"),t=document.getElementById("tabs");
 t.scrollTo({left:t.scrollLeft+b.getBoundingClientRect().left-t.getBoundingClientRect().left-(t.clientWidth-b.offsetWidth)/2,behavior:"smooth"});}
$.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==="open"){S.screen="menu";render();}
 else if(a==="home"){S.screen="welcome";S.mode=null;S.touched=false;render();}
 else if(a==="cat"){setCat(id);}
 else if(a==="inc"){S.cart[id]=(S.cart[id]||0)+1;refresh(id);}
 else if(a==="dec"){S.cart[id]=(S.cart[id]||0)-1;if(S.cart[id]<=0)delete S.cart[id];refresh(id);}
 else if(a==="cart"){S.sheet="cart";document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="close"){S.sheet=null;S.fail=false;document.getElementById("sheet").innerHTML="";}
 else if(a==="mode"){S.mode=t.dataset.m;S.sheet="form";S.touched=false;document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="tocart"){S.sheet="cart";S.fail=false;document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="when"){S.when=t.dataset.w;document.getElementById("sheet").innerHTML=sheetHTML();}
 else if(a==="send"){send();}
});
$.addEventListener("input",e=>{const t=e.target;
 if(t.id==="ph"){t.value=t.value.replace(/[^\d+\s()-]/g,"");S.phone=t.value;}
 else if(t.id==="mp")S.map=t.value;else if(t.id==="tm")S.time=t.value;
 else return;
 errs();});
$.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("#sheet")){S.touched=true;errs();}});
render();
</script>
</body>
</html>
